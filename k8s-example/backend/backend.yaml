apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: backend-sa
      containers:
        - name: backend
          image: ghcr.io/maciejwojs/k8s-example-backend:0.0.21
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          ports:
            - containerPort: 3000
          env:
            - name: USE_VAULT
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: USE_VAULT
            - name: VAULT_ADDR
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: VAULT_ADDR
            - name: VAULT_ROLE
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: VAULT_ROLE
            - name: VAULT_SECRET_PATH
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: VAULT_SECRET_PATH
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
