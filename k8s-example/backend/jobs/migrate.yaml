# DATABASE_URL: vault kv put secret/migrate DATABASE_URL='...'
# Atlas runs directly; Vault Agent Injector mounts credentials before the container starts.
apiVersion: batch/v1
kind: Job
metadata:
  name: atlas-migrate
  namespace: k8s-example
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 3
  template:
    metadata:
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/service: "http://k8s-example-vault.vault.svc.cluster.local:8200"
        vault.hashicorp.com/role: "migrate"
        vault.hashicorp.com/agent-inject-secret-database.env: "secret/data/migrate"
        vault.hashicorp.com/agent-inject-template-database.env: |
          {{- with secret "secret/data/migrate" -}}
          export DATABASE_URL="{{ .Data.data.DATABASE_URL }}"
          {{- end }}
    spec:
      serviceAccountName: migrate-sa
      restartPolicy: Never
      ttlSecondsAfterFinished: 120
      containers:
        - name: atlas
          image: ghcr.io/maciejwojs/k8s-example-backend:0.0.21
          workingDir: /app
          command: ["/bin/sh", "-ec"]
          args:
            - |
              . /vault/secrets/database.env
              exec atlas migrate apply --env local --url "${DATABASE_URL}?sslmode=disable"
