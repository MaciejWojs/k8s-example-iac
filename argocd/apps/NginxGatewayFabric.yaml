apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-example-nginx-gateway-fabric
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: default
  sources:
    - repoURL: ghcr.io/nginx/charts
      chart: nginx-gateway-fabric
      targetRevision: 2.6.7
      helm:
        valueFiles:
          - $values/nginx-gateway-fabric/values.yaml
    - repoURL: https://github.com/MaciejWojs/k8s-example-iac.git
      targetRevision: HEAD
      ref: values
      path: nginx-gateway-fabric
  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-gateway
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      refresh: true
    automated:
      enabled: true
      prune: true
      selfHeal: true
